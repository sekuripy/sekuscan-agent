[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sekuscan-agent"
version = "0.2.8"
description = "The SekuScan agent: drives a real browser inside your network on behalf of the SekuScan engine"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-PolyForm-Shield-1.0.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "pydantic>=2.5,<3.0",
    "httpx>=0.26,<1.0",
    "typer>=0.12,<1.0",
    "playwright>=1.48,<2.0",
    "websocket-client>=1.7,<2.0",
    "cryptography>=42,<47",
    "pyspnego>=0.10,<1.0",
    "certifi>=2023.7",
]

keywords = ["security", "scanner", "playwright", "sekuscan"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://sekuscan.com"
Source = "https://github.com/sekuripy/sekuscan-agent"
Changelog = "https://github.com/sekuripy/sekuscan-agent/blob/main/CHANGELOG.md"
Security = "https://sekuscan.com/security/"

[project.scripts]
sekuscan-agent = "sekuscan.agent.cli:main"

[tool.setuptools.packages.find]
include = ["sekuscan", "sekuscan.agent", "sekuscan.protocol"]
